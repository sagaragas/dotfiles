# ─── Theme ──────────────────────────────────────────────────────────────
include flexoki-light.conf

# ─── Font ───────────────────────────────────────────────────────────────
font_family      Ubuntu Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5
disable_ligatures always
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+F8FF,U+F0001-U+F1AF0 Symbols Nerd Font Mono
text_composition_strategy legacy


# ─── Window Layout ──────────────────────────────────────────────────────
window_margin_width        10
window_padding_width       10
window_border_width        2pt
active_border_color        #af3029
inactive_border_color      #cecdc3
inactive_text_alpha        0.5
single_window_margin_width 0
window_title_bar_min_windows 2

background_opacity         0.95
background_blur            20

enabled_layouts Tall,*

# ─── Cursor ─────────────────────────────────────────────────────────────
cursor_shape               beam
cursor_blink_interval      0.5
cursor_stop_blinking_after 0

# ─── Scrollback ─────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 8

# ─── Mouse / URLs ───────────────────────────────────────────────────────
copy_on_select         clipboard
strip_trailing_spaces  smart
focus_follows_mouse    yes

# ─── Performance ────────────────────────────────────────────────────────
repaint_delay  1
input_delay    0
sync_to_monitor no

# ─── Bell ───────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0
bell_on_tab          yes

# ─── Misc ───────────────────────────────────────────────────────────────
confirm_os_window_close   0
detect_urls               yes
url_style                 curly
notify_on_cmd_finish      invisible 10.0 notify
term                      xterm-256color

# ─── macOS ──────────────────────────────────────────────────────────────
macos_option_as_alt       yes
macos_custom_beam_cursor  yes
macos_quit_when_last_window_closed no

# ─── Tab Bar ────────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style separator
tab_bar_margin_width 11
tab_bar_min_tabs 1
tab_separator ""
tab_activity_symbol *
tab_title_template "{fmt.fg._cecdc3}{fmt.bg.default}{fmt.fg._100f0f}{fmt.bg._cecdc3} {fmt.fg._100f0f}{activity_symbol}{index}: {tab.active_wd.rsplit('/', 1)[-1]}{' [{}]'.format(num_windows) if num_windows > 1 else ''} {fmt.fg._cecdc3}{fmt.bg.default} "
active_tab_title_template "{fmt.fg._af3029}{fmt.bg.default}{fmt.fg._fffcf0}{fmt.bg._af3029} {fmt.fg._fffcf0}{activity_symbol}{index}: {tab.active_wd.rsplit('/', 1)[-1]}{' [{}]'.format(num_windows) if num_windows > 1 else ''} {fmt.fg._af3029}{fmt.bg.default} "

active_tab_font_style bold
inactive_tab_font_style normal

map cmd+t       new_tab_with_cwd
map cmd+w       close_window
map cmd+1       goto_tab 1
map cmd+2       goto_tab 2
map cmd+3       goto_tab 3
map cmd+4       goto_tab 4
map cmd+5       goto_tab 5
map cmd+6       goto_tab 6
map cmd+7       goto_tab 7
map cmd+8       goto_tab 8
map cmd+9       goto_tab 9
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+shift+right move_tab_forward
map cmd+shift+left  move_tab_backward

# ─── Splits ─────────────────────────────────────────────────────────────
map cmd+d       launch --cwd=current --location=hsplit
map cmd+shift+d launch --cwd=current --location=vsplit

# ─── Keybindings ────────────────────────────────────────────────────────
map f1 new_window_with_cwd
map f2 launch --cwd=current $EDITOR .

# ─── Shell Integration ─────────────────────────────────────────────────
shell_integration enabled
allow_hyperlinks yes
