# ─── Theme ──────────────────────────────────────────────────────────────
include factory-theme.conf

# ─── Font ───────────────────────────────────────────────────────────────
font_family      JetBrains Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.5
disable_ligatures always
text_composition_strategy legacy


# ─── Window Layout ──────────────────────────────────────────────────────
window_margin_width        7
window_padding_width       4
window_border_width        1pt
active_border_color        #ef6f2e
inactive_border_color      #3d3a39
inactive_text_alpha        0.5
single_window_margin_width 0
window_title_bar_min_windows 2
window_title_template "{custom}"

background_opacity         0.95
background_blur            15

enabled_layouts Splits,*

# ─── Cursor ─────────────────────────────────────────────────────────────
cursor_shape               beam
cursor_blink_interval      0.5
cursor_stop_blinking_after 0

# ─── Scrollback ─────────────────────────────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 8
pixel_scroll yes

# ─── Mouse / URLs ───────────────────────────────────────────────────────
copy_on_select         clipboard
strip_trailing_spaces  smart
focus_follows_mouse    yes

# ─── Performance ────────────────────────────────────────────────────────
repaint_delay  1
input_delay    0
sync_to_monitor no

# ─── Bell ───────────────────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0
bell_on_tab          yes

# ─── Misc ───────────────────────────────────────────────────────────────
confirm_os_window_close   0
detect_urls               yes
url_style                 curly
notify_on_cmd_finish      invisible 10.0 notify
term                      xterm-256color

# ─── macOS ──────────────────────────────────────────────────────────────
macos_option_as_alt       yes
macos_custom_beam_cursor  yes
macos_quit_when_last_window_closed no

# ─── Tab Bar ────────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style separator
tab_bar_margin_width 11
tab_bar_min_tabs 1
tab_separator ""
tab_activity_symbol *
tab_title_template "{fmt.fg._ef6f2e}{fmt.bg.default}{fmt.fg.black}{fmt.bg._ef6f2e} {fmt.fg._020202}{activity_symbol}{index}: {tab.active_wd.rsplit('/', 1)[-1]}{' [{}]'.format(num_windows) if num_windows > 1 else ''} {fmt.fg._ef6f2e}{fmt.bg.default} "
active_tab_title_template "{fmt.fg._ef6f2e}{fmt.bg.default}{fmt.fg.black}{fmt.bg._ef6f2e} {fmt.fg._020202}{activity_symbol}{index}: {tab.active_wd.rsplit('/', 1)[-1]}{' [{}]'.format(num_windows) if num_windows > 1 else ''} {fmt.fg._ef6f2e}{fmt.bg.default} "

active_tab_font_style bold
inactive_tab_font_style normal

map cmd+t       new_tab_with_cwd
map cmd+w       close_window
map cmd+1       goto_tab 1
map cmd+2       goto_tab 2
map cmd+3       goto_tab 3
map cmd+4       goto_tab 4
map cmd+5       goto_tab 5
map cmd+6       goto_tab 6
map cmd+7       goto_tab 7
map cmd+8       goto_tab 8
map cmd+9       goto_tab 9
map cmd+shift+] next_tab
map cmd+shift+[ previous_tab
map cmd+shift+right move_tab_forward
map cmd+shift+left  move_tab_backward

# ─── Splits ─────────────────────────────────────────────────────────────
map cmd+d       launch --cwd=current --location=vsplit
map cmd+shift+d launch --cwd=current --location=hsplit

# ─── Keybindings ────────────────────────────────────────────────────────
map f1 new_window_with_cwd
map f2 launch --cwd=current $EDITOR .

# ─── Shell Integration ─────────────────────────────────────────────────
shell_integration enabled
allow_hyperlinks yes
