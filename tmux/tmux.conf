# ─── General ────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000

# ─── Key Bindings ───────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane Borders (Factory) ─────────────────────────────────────
set -g pane-border-style "fg=#1f1d1c"
set -g pane-active-border-style "fg=#ef6f2e"

# ─── Status Bar (Factory) ───────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#020202 fg=#d6d3d2"

set -g status-left "#[fg=#020202,bg=#ef6f2e,bold] #S #[fg=#ef6f2e,bg=#020202] "
set -g status-left-length 30

set -g status-right "#[fg=#1f1d1c,bg=#020202]#[fg=#d6d3d2,bg=#1f1d1c] %Y-%m-%d #[fg=#ef6f2e,bg=#1f1d1c]#[fg=#020202,bg=#ef6f2e,bold] %H:%M "
set -g status-right-length 50

# Current window
setw -g window-status-current-format "#[fg=#020202,bg=#ef6f2e,bold] #I:#W #[fg=#ef6f2e,bg=#020202]"

# Inactive window
setw -g window-status-format "#[fg=#d6d3d2,bg=#1f1d1c] #I:#W #[fg=#1f1d1c,bg=#020202]"

# Messages
set -g message-style "fg=#020202 bg=#ef6f2e"
set -g message-command-style "fg=#020202 bg=#ef6f2e"
