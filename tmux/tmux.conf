# ─── General ────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000

# ─── Key Bindings ───────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane Borders (Moonfly) ─────────────────────────────────────
set -g pane-border-style "fg=#323437"
set -g pane-active-border-style "fg=#74b2ff"

# ─── Status Bar (Moonfly) ───────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#080808 fg=#bdbdbd"

set -g status-left "#[fg=#080808,bg=#74b2ff,bold] #S #[fg=#74b2ff,bg=#080808] "
set -g status-left-length 30

set -g status-right "#[fg=#323437,bg=#080808]#[fg=#bdbdbd,bg=#323437] %Y-%m-%d #[fg=#74b2ff,bg=#323437]#[fg=#080808,bg=#74b2ff,bold] %H:%M "
set -g status-right-length 50

# Current window
setw -g window-status-current-format "#[fg=#080808,bg=#74b2ff,bold] #I:#W #[fg=#74b2ff,bg=#080808]"

# Inactive window
setw -g window-status-format "#[fg=#bdbdbd,bg=#323437] #I:#W #[fg=#323437,bg=#080808]"

# Messages
set -g message-style "fg=#080808 bg=#74b2ff"
set -g message-command-style "fg=#080808 bg=#74b2ff"
