# ─── General ────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000

# ─── Key Bindings ───────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane Borders (Flexoki Light) ───────────────────────────────
set -g pane-border-style "fg=#cecdc3"
set -g pane-active-border-style "fg=#af3029"

# ─── Status Bar (Flexoki Light) ─────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#fffcf0 fg=#100f0f"

set -g status-left "#[fg=#fffcf0,bg=#af3029,bold] #S #[fg=#af3029,bg=#fffcf0] "
set -g status-left-length 30

set -g status-right "#[fg=#cecdc3,bg=#fffcf0]#[fg=#100f0f,bg=#cecdc3] %Y-%m-%d #[fg=#af3029,bg=#cecdc3]#[fg=#fffcf0,bg=#af3029,bold] %H:%M "
set -g status-right-length 50

# Current window
setw -g window-status-current-format "#[fg=#fffcf0,bg=#af3029,bold] #I:#W #[fg=#af3029,bg=#fffcf0]"

# Inactive window
setw -g window-status-format "#[fg=#100f0f,bg=#cecdc3] #I:#W #[fg=#cecdc3,bg=#fffcf0]"

# Messages
set -g message-style "fg=#fffcf0 bg=#af3029"
set -g message-command-style "fg=#fffcf0 bg=#af3029"
