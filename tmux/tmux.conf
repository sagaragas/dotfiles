# ─── General ────────────────────────────────────────────────────────────
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -g history-limit 10000

# ─── Key Bindings ───────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ─── Pane Borders (Modus Operandi Tinted) ───────────────────────────────
set -g pane-border-style "fg=#c2bcb5"
set -g pane-active-border-style "fg=#d00000"

# ─── Status Bar (Modus Operandi Tinted) ─────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#fbf7f0 fg=#000000"

set -g status-left "#[fg=#fbf7f0,bg=#d00000,bold] #S #[fg=#d00000,bg=#fbf7f0] "
set -g status-left-length 30

set -g status-right "#[fg=#c2bcb5,bg=#fbf7f0]#[fg=#000000,bg=#c2bcb5] %Y-%m-%d #[fg=#d00000,bg=#c2bcb5]#[fg=#fbf7f0,bg=#d00000,bold] %H:%M "
set -g status-right-length 50

# Current window
setw -g window-status-current-format "#[fg=#fbf7f0,bg=#d00000,bold] #I:#W #[fg=#d00000,bg=#fbf7f0]"

# Inactive window
setw -g window-status-format "#[fg=#000000,bg=#c2bcb5] #I:#W #[fg=#c2bcb5,bg=#fbf7f0]"

# Messages
set -g message-style "fg=#fbf7f0 bg=#d00000"
set -g message-command-style "fg=#fbf7f0 bg=#d00000"
